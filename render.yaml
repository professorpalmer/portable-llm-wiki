# Render Blueprint — backend (FastAPI) deployment.
#
# Click "Deploy to Render" on the README to deploy directly from a fork
# of this repo. Render will read this file and:
#   1. Provision the `portable-llm-wiki-backend` web service from the
#      backend/Dockerfile.
#   2. Auto-generate a strong OWNER_TOKEN (you read it back from the
#      dashboard after the first deploy).
#   3. Prompt you for the `sync: false` env vars below (WIKI_GIT_REMOTE,
#      ANTHROPIC_API_KEY, OPENAI_API_KEY, CORS_ORIGINS, PUBLIC_BASE_URL).
#      Leave any of them blank — sensible fallbacks kick in — and come
#      back to fill them in after you know your frontend URL.
#
# After deploy, the post-click runway lives at scripts/deploy.md.
#
# Free-tier persistence (recommended):
#   Render's free plan uses an ephemeral filesystem — writes are lost
#   when the container cold-starts after 15 min idle. To get persistence
#   on the free tier, point the wiki at a private GitHub content repo
#   via WIKI_GIT_REMOTE (see scripts/deploy.md for the 4-step setup).
#   On boot, the container clones the repo into /app/wiki. Every
#   mutation triggers a debounced commit + push back to that repo. Cold
#   starts re-clone the latest state, so the wiki survives indefinitely.
#
# Alternative: upgrade to Starter ($7/mo) and mount a Render Disk at
# /app/wiki instead. Faster startup, more expensive, less portable.

services:
  - type: web
    name: portable-llm-wiki-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # The Dockerfile's CMD runs uvicorn directly. The Avery-tenant seed
    # is handled inside the FastAPI app's lifespan hook
    # (app/avery_seed.py::auto_seed_if_missing) the first time the
    # multi-tenant manager loads — never raises, never overwrites — so
    # no shell wrapping is needed in dockerCommand. Keeping this slot
    # empty also avoids subtle quoting bugs where Render's argv handling
    # would split a bash -c '...' string mid-quote.
    envVars:
      # --- Required, with safe defaults baked into the image ---
      - key: WIKI_ROOT
        value: /app/wiki
      - key: DEFAULT_TIER
        value: public
      - key: OWNER_TOKEN
        generateValue: true  # Render auto-generates a strong value

      # --- Single-tenant (OSS) vs multi-tenant (hosted) toggle ---
      # PROMPTED at first deploy because the right value depends on
      # what you're building:
      #
      #   * OSS self-host: enter "1" (or leave blank — the app's
      #     config.py defaults to "1" when this env var is unset). This
      #     is the single-tenant path that has worked since v0.
      #   * Hosted (portablellm.wiki and any clone running OAuth for
      #     more than one user): enter "0". When 0, the docker command
      #     above seeds the public Avery demo tenant under
      #     <TENANTS_ROOT>/avery/ on every boot (idempotent).
      #
      # WHY ``sync: false`` instead of ``value: "1"``:
      # A previous version of this blueprint hard-coded ``value: "1"``
      # as a friendly default for OSS self-hosters. That worked for
      # them, but on the hosted production deploy it silently stomped
      # the dashboard override back to "1" on a Render Blueprint sync
      # — instantly converting a hosted multi-tenant service into a
      # single-tenant one mid-flight (every /auth/* + /t/* + /owner/*
      # route 404'd until the env var was reset by hand). Marking it
      # ``sync: false`` makes the dashboard value the source of truth
      # and never overwrites it on a blueprint sync. The app's own
      # default ("1" when unset) still covers self-hosters who skip
      # the prompt.
      - key: SINGLE_TENANT_MODE
        sync: false

      # --- Multi-tenant root (only used when SINGLE_TENANT_MODE=0) ---
      # Where per-tenant wikis live. Each tenant gets
      # <TENANTS_ROOT>/<id>/wiki|raw|tenant.json. Default sits next to
      # WIKI_ROOT so a Render disk mounted at /app survives both.
      - key: TENANTS_ROOT
        value: /app/tenants

      # --- LLM model selection (defaults; override only to switch models) ---
      # ANTHROPIC_MODEL / OPENAI_MODEL is the model tried FIRST for
      # /wiki/query and /wiki/chat. If the provider returns 404 / "model
      # not found" (i.e. the vendor has deprecated this ID), the backend
      # automatically cycles to the next entry in the fallback chain
      # defined in backend/app/llm.py. That means a future deprecation
      # does NOT require a redeploy — the keyword digest will still
      # degrade gracefully even if every model in the chain is gone.
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # --- Git-backed persistence defaults ---
      # Commit-author identity for the autosync bot. Override in the
      # dashboard if you want commits attributed to you.
      - key: WIKI_GIT_BRANCH
        value: main
      - key: WIKI_GIT_USER_NAME
        value: Portable LLM Wiki Bot
      - key: WIKI_GIT_USER_EMAIL
        value: wiki-bot@example.com
      - key: WIKI_GIT_PUSH_DELAY_S
        value: "8"

      # --- Prompted at Blueprint deploy time, blank = use defaults ---
      # The clone URL for your private wiki content repo (recommended —
      # without it, writes are lost on cold-start). Generated by:
      #   npx create-portable-llm-wiki my-wiki
      # then push to a private GitHub repo. PAT scope: Contents
      # read & write. Format:
      #   https://USER:PAT@github.com/USER/my-wiki.git
      - key: WIKI_GIT_REMOTE
        sync: false

      # Optional. If set, /wiki/query uses Anthropic; otherwise falls
      # through to OPENAI_API_KEY, then to a keyword-scoring fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Comma-separated allow-list for CORS. Include every host the
      # frontend is reachable at — e.g. your custom domain AND the
      # vercel.app fallback URL, comma-separated:
      #   https://portablellm.wiki,https://portable-llm-wiki.vercel.app
      # Leave blank to use the localhost default (won't work cross-origin
      # from a production frontend).
      - key: CORS_ORIGINS
        sync: false

      # Public-facing URL of the frontend — used for QR / share links
      # in `/share` and the .well-known manifest. Set to your primary
      # custom domain (e.g. https://portablellm.wiki) once DNS is live.
      - key: PUBLIC_BASE_URL
        sync: false
    healthCheckPath: /healthz
    autoDeploy: true  # redeploy on every push to main
